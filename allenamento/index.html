<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7C66" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Allenamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one column; main tabs Palestra / Corsa / Cibo / Stats, sub-tabs inside; one card per exercise, run or meal */
:root {
  --bg: #EEF1EF;
  --card: #FFFFFF;
  --fg: #151917;
  --muted: #5F6A65;
  --line: #D5DCD8;
  --accent: #0E7C66;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFEA;
  --gym: #0E7C66;
  --run: #6A4FE0;
  --food: #C4622D;
  --water: #2F8FD0;
  --ok: #2E7D4F;
  --err: #B3261E;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* Each section takes its own accent: Palestra green, Corsa violet, Cibo orange, Stats blue */
body[data-sec="corsa"] { --accent: #5B3FD6; --accent-soft: #E7E2FB; --accent-ink: #FFFFFF; }
body[data-sec="cibo"] { --accent: #B9561F; --accent-soft: #F8E4D7; --accent-ink: #FFFFFF; }
body[data-sec="stats"] { --accent: #1F6FB2; --accent-soft: #DCEAF7; --accent-ink: #FFFFFF; }
@media (prefers-color-scheme: dark) {
  body[data-sec="corsa"] { --accent: #9B86FF; --accent-soft: #2A2450; --accent-ink: #150E33; }
  body[data-sec="cibo"] { --accent: #EE8A52; --accent-soft: #3A251A; --accent-ink: #2A1306; }
  body[data-sec="stats"] { --accent: #6FB2EA; --accent-soft: #17304A; --accent-ink: #061A2C; }
}
body[data-sec] h1 { color: var(--accent); }
nav { border-bottom: 3px solid var(--accent); }
body, nav, body::before { transition: background-color .2s; }
@media (prefers-color-scheme: dark) { :root {
  --bg: #0F1312; --card: #182020; --fg: #E8EEEB; --muted: #94A39D; --line: #2A3532;
  --accent: #3CC4A3; --accent-ink: #062018; --accent-soft: #173A32;
  --gym: #3CC4A3; --run: #9B86FF; --food: #EE8A52; --water: #6FB2EA; --ok: #5FC48A; --err: #F2827A; color-scheme: dark } }

body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4; }
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-size: 2rem; margin: 0; text-transform: uppercase; }
h2 { font-family: var(--display); font-size: 1.3rem; text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.date { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: .9rem; }
.date input, select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; max-width: 100%; }
.status { font-size: .8rem; color: var(--muted); min-height: 1.2em; margin-top: 4px; }
.status.err { color: var(--err); }
.sub { color: var(--muted); font-size: .85rem; font-weight: 400; }
.sub.warn { color: var(--err); }
.help { color: var(--muted); font-size: .85rem; margin: 0; }

nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding-block: 12px; }
nav button { font-family: var(--display); font-size: 1.1rem; text-transform: uppercase; letter-spacing: .03em; padding: 10px 0; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.subnav { display: grid; gap: 6px; }
.subnav button { font: 600 .95rem var(--body); padding: 8px 0; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.subnav button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.ss { display: flex; flex-direction: column; gap: 6px; border-left: 3px solid var(--accent); padding-left: 8px; }
.ss-label { font-family: var(--display); font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.card, .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.done { border-color: var(--ok); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-name { font-weight: 600; font-size: 1.05rem; min-width: 0; }
.scheme { font-family: var(--display); font-size: 1.15rem; white-space: nowrap; background: var(--accent-soft); color: var(--fg); border-radius: 6px; padding: 1px 8px; font-variant-numeric: tabular-nums; }
.scheme.run { background: color-mix(in srgb, var(--run) 18%, transparent); }
.workout { display: flex; flex-direction: column; gap: 4px; border-left: 3px solid var(--run); padding-left: 10px; }
.workout b { font-size: 1.05rem; }
.videos { display: flex; flex-wrap: wrap; gap: 6px; }
.videos a { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 5px 12px; font-size: .9rem; font-weight: 600; }
.videos a svg { width: 14px; height: 14px; fill: currentColor; }
.log { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.log.log3 { grid-template-columns: 1fr 1fr 1fr; }
.log .wide { grid-column: 1 / -1; }
.log label { display: flex; flex-direction: column; gap: 3px; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); min-width: 0; }
.log input { font: 600 1.25rem/1.2 var(--display); letter-spacing: .04em; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; font-variant-numeric: tabular-nums; }
.prev { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.prev b { color: var(--fg); font-weight: 600; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.center { text-align: center; flex: 1; min-width: 0; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }

.types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.types button { font: 600 .95rem/1.15 var(--body); padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.types button small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.types button[aria-pressed="true"] { border-color: var(--food); box-shadow: inset 0 0 0 1px var(--food); background: color-mix(in srgb, var(--food) 14%, transparent); }
.time { font-family: var(--display); font-size: 1.1rem; color: var(--muted); }
.check { display: inline-flex; align-items: center; gap: 6px; font: 600 .9rem var(--body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap; }
.check[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
.items { display: flex; flex-direction: column; }
.item { border-top: 1px solid var(--line); padding-block: 8px; }
.item:first-child { border-top: 0; padding-top: 0; }
.item-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; width: 100%; background: none; border: 0; color: inherit; font: inherit; text-align: left; padding: 0; }
button.item-row { cursor: pointer; }
.item-name { font-weight: 600; min-width: 0; }
.item-q { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.swap { font-size: .8rem; color: var(--food); font-weight: 600; }
.alts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.alts button { font: 500 .85rem var(--body); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.alts button[aria-pressed="true"] { border-color: var(--food); font-weight: 600; }
.note { font-size: .85rem; color: var(--food); font-weight: 600; }
.water { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.glasses { display: flex; gap: 4px; flex-wrap: wrap; }
.glass { width: 22px; height: 28px; border: 2px solid var(--water); border-top: 0; border-radius: 0 0 6px 6px; background: transparent; padding: 0; cursor: pointer; }
.glass.on { background: var(--water); }
.water-n { font: 700 1.4rem var(--display); color: var(--water); font-variant-numeric: tabular-nums; }
.weigh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.weigh input { font: 700 1.8rem/1.1 var(--display); width: 6.5rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
.weigh .unit { font: 600 1.2rem var(--display); color: var(--muted); }
.shop h3 { font: 600 .8rem var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 6px 0 2px; }
.shop label { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.shop input { width: 20px; height: 20px; accent-color: var(--food); }
.shop label.got span { text-decoration: line-through; color: var(--muted); }
.tips { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }

.sect { font: 600 .8rem var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 10px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; border-top: 3px solid var(--line); }
.tile.t-gym { border-top-color: var(--gym); } .tile.t-run { border-top-color: var(--run); } .tile.t-food { border-top-color: var(--food); } .tile.t-water { border-top-color: var(--water); }
.tile .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile .v { font: 700 1.7rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 17px var(--body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .val { fill: var(--fg); font-weight: 600; }
.chart rect.c-gym { fill: var(--gym); } .chart rect.c-run { fill: var(--run); } .chart rect.c-food { fill: var(--food); } .chart rect.c-water { fill: var(--water); }
.chart.c-gym { --c: var(--gym); } .chart.c-run { --c: var(--run); } .chart.c-food { --c: var(--food); }
.chart .line { fill: none; stroke: var(--c); stroke-width: 2.5; }
.chart .dot { fill: var(--c); }
.chart .area { fill: var(--c); opacity: .14; }
.legend { display: flex; gap: 14px; font-size: .8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.legend i.c-gym { background: var(--gym); } .legend i.c-run { background: var(--run); }
.radar { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }
.radar .ring { fill: none; stroke: var(--line); stroke-width: 1; }
.radar .spoke { stroke: var(--line); stroke-width: 1; }
.radar .tick { fill: var(--muted); font: 12px var(--body); }
.radar .plan { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
.radar .done { fill: var(--gym); fill-opacity: .28; stroke: var(--gym); stroke-width: 2.5; stroke-linejoin: round; }
.radar .pt { fill: var(--gym); }
.radar .lbl { fill: var(--fg); font: 600 18px var(--body); }
.radar .num { fill: var(--muted); font: 15px var(--body); font-variant-numeric: tabular-nums; }
.radar .num.low { fill: var(--err); }
.rlegend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); align-items: center; }
.rlegend i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.rlegend .l-done { background: var(--gym); opacity: .6; }
.rlegend .l-plan { border: 1.5px dashed var(--muted); height: 7px; }
.hint b { color: var(--err); }
.facts.f4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 520px) { .facts.f4 { grid-template-columns: repeat(4, 1fr); } }
.hbar .fill.run { background: var(--run); }
.hbars { display: flex; flex-direction: column; gap: 6px; }
.hbar { display: grid; grid-template-columns: minmax(0, 9rem) 1fr auto; gap: 8px; align-items: center; font-size: .9rem; }
.hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
.hbar .fill { display: block; height: 100%; background: var(--food); border-radius: 5px; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; padding: 4px 6px; border-bottom: 1px solid var(--line); }
td { padding: 6px; border-bottom: 1px solid var(--line); }
td.num, th.num { text-align: right; white-space: nowrap; }
td.muted { color: var(--muted); font-size: .85rem; }
.up { color: var(--accent); font-weight: 600; }
.tbl { overflow-x: auto; }
.empty { color: var(--muted); font-size: .9rem; margin: 0; }

.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: 600 .95rem var(--body); padding: 8px 14px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn.dirty::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--err); margin-left: 6px; vertical-align: middle; }
.panel.demo { border-color: var(--accent); background: var(--accent-soft); }
#syncPanel { margin-top: 8px; }

/* Day button in the header (opens the calendar) */
.datebtn { display: inline-flex; align-items: center; gap: 6px; font: 600 .95rem var(--body); color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
.datebtn svg { width: 16px; height: 16px; fill: var(--accent); }

/* Stats tiles open a detail sheet */
button.tile { font: inherit; color: inherit; text-align: left; cursor: pointer; position: relative; width: 100%; }
button.tile::after { content: "›"; position: absolute; right: 8px; top: 4px; color: var(--muted); font-size: 1.2rem; line-height: 1; }
.tile .k, .tile .v { display: block; }
button.tile:active { transform: scale(.98); }

/* Bottom sheet */
body.noscroll { overflow: hidden; }
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgb(0 0 0 / .45); }
.sheet[data-kind="gym"] { --k: var(--gym); } .sheet[data-kind="run"] { --k: var(--run); }
.sheet[data-kind="weight"], .sheet[data-kind="meals"] { --k: var(--food); } .sheet[data-kind="water"] { --k: var(--water); }
.sheet[data-kind="cal"] { --k: var(--accent); }
.sheet-card { --accent: var(--k); --accent-soft: color-mix(in srgb, var(--k) 16%, transparent); --accent-ink: var(--card);
  position: relative; width: 100%; max-width: 640px; box-sizing: border-box; max-height: 90vh; max-height: 90dvh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg); border-radius: 18px 18px 0 0; padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 30px rgb(0 0 0 / .25); animation: sheetUp .22s ease-out; }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } }
.sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 2px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: -8px; z-index: 2; background: var(--bg); padding-block: 8px; }
.sheet-head h2 { font-size: 1.7rem; color: var(--k); }
.sheet-body { display: flex; flex-direction: column; gap: 10px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pills button { flex: 1; font: 600 .9rem var(--body); padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap; }
.pills button[aria-pressed="true"] { border-color: var(--k); background: color-mix(in srgb, var(--k) 16%, transparent); }
.daychart { touch-action: manipulation; cursor: pointer; }
.daychart.c-water { --c: var(--water); }
.daychart rect.bar { fill: var(--c); opacity: .45; }
.daychart rect.bar.on { opacity: 1; }
.daychart rect.selcol { fill: var(--c); opacity: .1; }
.daychart rect.hit { fill: transparent; }
.daychart .dot.on { stroke: var(--card); stroke-width: 3; }
.daychart text.selv { fill: var(--fg); font-weight: 700; }
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dayhead h3 { font: 700 1.25rem var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0; text-align: center; flex: 1; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.sheet-body > .facts .fact { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--k); }
.fact { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
.fact .k { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.fact .v { display: block; font: 700 1.35rem/1.15 var(--display); font-variant-numeric: tabular-nums; }
.mealrow { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.mealrow:first-child { border-top: 0; }
.mealrow .ok { color: var(--ok); font-weight: 600; } .mealrow .no { color: var(--muted); }

/* Pie (donut) and goal rings */
.msg { margin: 0; font-size: 1rem; font-weight: 600; line-height: 1.35; }
.donutbox { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.donut { width: 132px; height: 132px; flex: none; }
.donut circle { fill: none; stroke-width: 24; }
.donut .track { stroke: var(--line); opacity: .45; }
.donut.rings circle { stroke-width: 17; stroke-linecap: round; }
.donut.rings .rtrack { opacity: .16; }
.donut .dc { fill: var(--fg); font: 700 46px var(--display); text-anchor: middle; font-variant-numeric: tabular-nums; }
.donut .dc.small { font-size: 34px; }
.donut .ds { fill: var(--muted); font: 500 17px var(--body); text-anchor: middle; }
.dleg { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 130px; }
.dleg li { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
.dleg i { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.dleg span { flex: 1; color: var(--muted); }
.dleg b { font: 700 1.25rem var(--display); font-variant-numeric: tabular-nums; }
@media (max-width: 360px) { .donut { width: 112px; height: 112px; } }

/* Calendar */
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-nav h3 { font: 700 1.3rem var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0; flex: 1; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-w { text-align: center; font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding-block: 4px; }
.cal-d { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 7px 0 6px; min-height: 50px; border: 0; border-radius: 10px; background: transparent; color: var(--fg); font: 600 1.05rem var(--body); font-variant-numeric: tabular-nums; cursor: pointer; }
.cal-d.out { opacity: .4; }
.cal-d.today .n { color: var(--accent); text-decoration: underline 2px; text-underline-offset: 3px; }
.cal-d.sel { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); }
.dots { display: flex; gap: 3px; height: 8px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; display: block; }
i.d-gym { background: var(--gym); } i.d-run { background: var(--run); }
.cal-legend { display: flex; gap: 14px; justify-content: center; font-size: .8rem; color: var(--muted); }
.cal-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
.daysum { display: flex; flex-direction: column; gap: 6px; }
.daysum .row { display: flex; gap: 8px; align-items: baseline; }
.daysum .row i { flex: none; width: 9px; height: 9px; border-radius: 50%; transform: translateY(-1px); }
@media (prefers-reduced-motion: reduce) { .sheet-card { animation: none; } button.tile:active { transform: none; } }
@media (max-width: 380px) { nav button { font-size: 1rem; } .tile .v { font-size: 1.4rem; } .log.log3 { grid-template-columns: 1fr 1fr; } .types button { font-size: .85rem; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Allenamento</h1>
    <div class="head-actions">
      <input type="hidden" id="date">
      <button class="datebtn" id="dateBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zm-2 7h14v11H5V9z"/></svg><span id="dateLabel"></span></button>
      <button class="btn ghost small" id="installBtn" hidden>Installa app</button>
      <button class="btn small" id="syncBtn">Sincronizza</button>
    </div>
  </header>
  <div class="status" id="status"></div>
  <section class="panel" id="syncPanel" hidden>
    <div class="panel-head"><h2>Sincronizza con il NAS</h2><button class="btn ghost small" id="syncClose">Chiudi</button></div>
    <div id="syncBody"></div>
    <div class="status" id="syncMsg"></div>
    <div class="sub" id="syncInfo"></div>
  </section>
  <nav role="tablist" id="tabs"></nav>
  <main class="list" id="list"></main>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grab"></div>
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="btn ghost small" id="sheetClose">Chiudi</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<script src="config.js"></script>
<script>
// ---------- Contenuti dal file config.js del cliente ----------
const APP = CONFIG.app || {};
const GYM = CONFIG.gym || {};
const RUN = CONFIG.run && Object.keys(CONFIG.run).length ? CONFIG.run : null;
const RUN_INFO = CONFIG.runInfo || {};
const FOOD_CFG = CONFIG.food || null;
const g = (s) => s.split("|").map((x) => { const m = x.trim().match(/^(.*?)\s+(\d[\d,.]*\s*(?:g|ml|cucchiai|cucchiaino|uova|uovo|banana|mela|pera|kiwi|pesca|arancia|mozzarella|fette|fetta|vasetto)|\d+\s*\w+)$/); return m ? [m[1], m[2]] : [x.trim(), ""]; });
const FOOD = FOOD_CFG ? FOOD_CFG.plans : { riposo: { name: "", sub: "", meals: [] } };
for (const d of Object.values(FOOD)) for (const m of d.meals) m.items = m.items.map((x) => typeof x === "string" ? g(x) : x);
const SHOP = (FOOD_CFG && FOOD_CFG.shop) || [];
const TIPS = (FOOD_CFG && FOOD_CFG.tips) || [];
const HAS = { gym: Object.keys(GYM).length > 0, run: !!RUN, food: !!FOOD_CFG };
const RUN_LEN = RUN ? Math.max(...Object.values(RUN).map((x) => x.weeks.length)) : 1;
const foodType = (t) => FOOD[t] ? t : Object.keys(FOOD)[0];
document.title = APP.name || "Allenamento";

// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function todayKey(d = new Date()) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fmtDate(key) { const [, m, d] = key.split("-"); return d + "/" + m; }
function addDays(key, n) { const d = new Date(key + "T12:00"); d.setDate(d.getDate() + n); return todayKey(d); }
function weekday(key) { return new Date(key + "T12:00").getDay(); }
function weekStart(key) { return addDays(key, -((weekday(key) + 6) % 7)); }
function setStatus(t, err) { $("status").textContent = t; $("status").classList.toggle("err", !!err); }
function vids(list) { return `<div class="videos">${list.map(([l, q]) => `<a href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}" target="_blank" rel="noopener">${PLAY}${esc(l)}</a>`).join("")}</div>`; }
function kgNum(s) { const n = parseFloat(String(s || "").replace(",", ".")); return isFinite(n) ? n : null; }
function fmt1(v) { return (Math.round(v * 10) / 10).toFixed(1).replace(".", ","); }
// "886" -> [8,8,6]; "12 10 10" -> [12,10,10]; "121010" -> [12,10,10]
function parseReps(s) {
  s = String(s || "").trim();
  if (!s) return [];
  if (/[^0-9]/.test(s)) return s.split(/[^0-9]+/).filter(Boolean).map(Number);
  const out = [];
  for (let i = 0; i < s.length; i++) {
    if (s[i] === "1" && i + 1 < s.length && s.length > 1) { out.push(Number(s.slice(i, i + 2))); i++; }
    else out.push(Number(s[i]));
  }
  return out;
}
// "25:30" or "1:02:10" -> seconds
function parseTime(s) {
  const p = String(s || "").trim().replace(/[.,]/g, ":").split(":").map(Number);
  if (!p.length || p.some((x) => !isFinite(x))) return null;
  const sec = p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : p[0] * 60;
  return sec > 0 ? sec : null;
}
function fmtPace(sec) { if (!sec || !isFinite(sec)) return "–"; sec = Math.round(sec); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }

const GYM_EX = {};   // exId -> { ex, dayKey }
for (const [dk, d] of Object.entries(GYM)) for (const it of d.items) for (const ex of (it.ss || [it])) GYM_EX[ex.id] = { ex, dayKey: dk };
const WDN = { dom: 0, lun: 1, mar: 2, mer: 3, gio: 4, ven: 5, sab: 6 };
const GYM_WD = Object.fromEntries(Object.keys(GYM).filter((k) => k in WDN).map((k) => [WDN[k], k]));

// ---------- Data (stesse chiavi delle due app precedenti, così i dati già salvati restano) ----------
const NS = CONFIG.id ? CONFIG.id + "-" : "";
const K = { gym: NS + "scheda-logs", run: NS + "corsa-logs", diet: NS + "dieta-days", shop: NS + "dieta-spesa", meta: NS + "allenamento-sync", runStart: NS + "corsa-inizio" };
function load(k, def) { try { return JSON.parse(localStorage.getItem(k) || "") || def; } catch (e) { return def; } }
const G = load(K.gym, {});     // exId -> { date: { r, kg, t } }
const R = load(K.run, {});     // date -> { s: "A"|"B"|"X", km, time, split, rpe, note, t }
const D = load(K.diet, {});    // date -> { type?, meals, water, kg, t }
let shop = load(K.shop, {});
let runStart = (() => { try { return localStorage.getItem(K.runStart); } catch (e) { return null; } })();
if (!runStart) { runStart = weekStart(todayKey()); try { localStorage.setItem(K.runStart, runStart); } catch (e) {} }

function persist() {
  try {
    localStorage.setItem(K.gym, JSON.stringify(G));
    localStorage.setItem(K.run, JSON.stringify(R));
    localStorage.setItem(K.diet, JSON.stringify(D));
    return true;
  } catch (e) { setStatus("Non riesco a salvare sul dispositivo (memoria piena o bloccata).", true); return false; }
}
let saveTimer;
function queueSave() {
  clearTimeout(saveTimer);
  setStatus("Salvataggio…");
  saveTimer = setTimeout(() => { if (persist()) setStatus("Salvato sul dispositivo ✓"); refreshSyncInfo(); }, 400);
}

// demo data lives only in memory
let demo = null;   // { label, G, R, D }
const SG = () => demo ? demo.G : G, SR = () => demo ? demo.R : R, SD = () => demo ? demo.D : D;
const hasG = (e) => e && (e.r || e.kg);
const hasR = (e) => e && (e.km || e.time);
function gymDates(GG) { const s = new Set(); for (const h of Object.values(GG)) for (const [d, e] of Object.entries(h)) if (hasG(e)) s.add(d); return s; }

// ---------- Alimentazione: tipo di giornata automatico ----------
function autoType(key, GG = G, RR = R) {
  const t = (k, why) => [foodType(k), why];
  for (const h of Object.values(GG)) if (hasG(h[key])) return t("pesi", "hai segnato la palestra");
  if (hasR(RR[key])) return t("corsa", "hai segnato una corsa");
  const wd = weekday(key);
  if (GYM_WD[wd]) return t("pesi", "oggi è giorno di palestra");
  if (RUN && Object.values(RUN).some((x) => (x.wd || []).includes(wd))) return t("corsa", "oggi è giorno di corsa");
  return t("riposo", "nessun allenamento previsto");
}
function dietDay(key, DD = D, GG = G, RR = R) {
  const d = DD[key] || { meals: {}, water: 0, t: 0 };
  const [auto, why] = autoType(key, GG, RR);
  return { ...d, type: foodType(d.type || auto), auto: !d.type, why };
}
function mealPct(k, DD = D, GG = G, RR = R) {
  const d = DD[k]; if (!d) return null;
  const ms = FOOD[dietDay(k, DD, GG, RR).type].meals;
  return ms.length ? Math.round(100 * ms.filter((m) => (d.meals || {})[m.id]?.done).length / ms.length) : null;
}
function touchDiet(key, patch) {
  const cur = D[key] || { meals: {}, water: 0, t: 0 };
  D[key] = { ...cur, ...patch, t: Date.now() };
  queueSave();
}

// ---------- Navigation ----------
const TABS = {};
if (HAS.gym) TABS.palestra = "Palestra";
if (HAS.run) TABS.corsa = "Corsa";
if (HAS.food) TABS.cibo = "Cibo";
TABS.stats = "Stats";
const dateEl = $("date");
dateEl.value = todayKey();
let tab, gymDay, foodSub = "pasti", runWeekOffset = 0, chartEx = null;
function defaults(key) {
  const wd = weekday(key);
  gymDay = GYM_WD[wd] || nextGymDay(key);
  const want = GYM_WD[wd] ? "palestra" : RUN && Object.values(RUN).some((x) => (x.wd || []).includes(wd)) ? "corsa" : "cibo";
  return TABS[want] ? want : Object.keys(TABS)[0];
}
function nextGymDay(key) { for (let i = 0; i < 7; i++) { const k = GYM_WD[weekday(addDays(key, i))]; if (k) return k; } return Object.keys(GYM)[0]; }
const h0 = location.hash.slice(1);
tab = defaults(dateEl.value);
if (TABS[h0]) tab = h0;

function selectTab(k) {
  if (k !== "stats") demo = null;
  tab = k;
  try { history.replaceState(null, "", "#" + k); } catch (e) {}
  renderTabs(); render(); window.scrollTo({ top: 0 });
}
function renderTabs() {
  $("tabs").innerHTML = "";
  for (const [k, label] of Object.entries(TABS)) {
    const b = document.createElement("button");
    b.id = "tab-" + k; b.setAttribute("role", "tab"); b.textContent = label;
    b.setAttribute("aria-selected", k === tab);
    b.onclick = () => selectTab(k);
    $("tabs").appendChild(b);
  }
}
function subnav(items, cur, onPick) {
  const el = document.createElement("div");
  el.className = "subnav";
  el.style.gridTemplateColumns = `repeat(${items.length}, 1fr)`;
  for (const [k, label] of items) {
    const b = document.createElement("button");
    b.textContent = label; b.setAttribute("aria-pressed", k === cur);
    b.onclick = () => { onPick(k); render(); };
    el.appendChild(b);
  }
  return el;
}
const SEC_COLOR = { palestra: "#0E7C66", corsa: "#5B3FD6", cibo: "#B9561F", stats: "#1F6FB2" };
const DOW = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
const DOW_FULL = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
const MONTHS = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
function longDate(k) { const [y, m, d] = k.split("-").map(Number); return DOW_FULL[weekday(k)] + " " + d + " " + MONTHS[m - 1] + (y !== new Date().getFullYear() ? " " + y : ""); }
function render() {
  document.body.dataset.sec = tab;
  const dk = dateEl.value;
  $("dateLabel").textContent = (dk === todayKey() ? "Oggi" : DOW[weekday(dk)]) + " " + fmtDate(dk);
  $("dateBtn").setAttribute("aria-label", "Giorno: " + longDate(dk) + ". Apri il calendario");
  const tc = $("themeColor"); if (tc) tc.content = SEC_COLOR[tab];
  ({ palestra: renderGym, corsa: renderRun, cibo: renderFood, stats: renderStats })[tab]();
}

// ---------- Palestra ----------
function gymPrev(exId) {
  const h = G[exId] || {}, cur = dateEl.value;
  const past = Object.keys(h).filter((k) => k < cur && hasG(h[k])).sort().reverse().slice(0, 3);
  if (!past.length) return "Nessuna sessione precedente";
  return "Prima: " + past.map((k) => `<b>${esc(h[k].r || "–")}</b>${h[k].kg ? " · " + esc(h[k].kg) + " kg" : ""} <span>(${fmtDate(k)})</span>`).join(" &nbsp; ");
}
function gymCard(ex) {
  const el = document.createElement("section");
  el.className = "card";
  const cur = (G[ex.id] || {})[dateEl.value] || {};
  el.innerHTML = `
    <div class="card-top">
      <div class="card-name">${esc(ex.n)}${ex.note ? `<div class="sub">${esc(ex.note)}</div>` : ""}</div>
      <span class="scheme">${esc(ex.s)}</span>
    </div>
    ${vids(ex.v)}
    <div class="log">
      <label>Reps per serie<input id="r-${ex.id}" inputmode="numeric" autocomplete="off" placeholder="es. 886" value="${esc(cur.r || "")}"></label>
      <label>Carico (kg)<input id="kg-${ex.id}" inputmode="decimal" autocomplete="off" placeholder="es. 40" value="${esc(cur.kg || "")}"></label>
    </div>
    <div class="prev">${gymPrev(ex.id)}</div>`;
  for (const f of ["r", "kg"]) {
    const inp = el.querySelector(`#${f}-${CSS.escape(ex.id)}`);
    inp.addEventListener("input", () => {
      const k = dateEl.value;
      G[ex.id] = G[ex.id] || {};
      G[ex.id][k] = { ...(G[ex.id][k] || {}), [f]: inp.value.trim(), t: Date.now() };
      queueSave();
    });
  }
  return el;
}
function renderGym() {
  const list = $("list");
  list.innerHTML = "";
  list.appendChild(subnav(Object.entries(GYM).map(([k, d]) => [k, d.name]), gymDay, (k) => { gymDay = k; }));
  list.insertAdjacentHTML("beforeend", `<p class="help">Reps: una cifra per serie (3×8 con ultima a 6 → <b>886</b>; con 10 o più usa gli spazi: <b>12 10 10</b>).</p>`);
  for (const it of GYM[gymDay].items) {
    if (it.ss) {
      const g = document.createElement("div");
      g.className = "ss";
      g.innerHTML = '<div class="ss-label">Superserie</div>';
      it.ss.forEach((ex) => g.appendChild(gymCard(ex)));
      list.appendChild(g);
    } else list.appendChild(gymCard(it));
  }
}

// ---------- Corsa ----------
function runWeekIndex(key) { return Math.floor((new Date(weekStart(key) + "T12:00") - new Date(runStart + "T12:00")) / (7 * 864e5)); }
function runPrev(sess, before) {
  const ks = Object.keys(R).filter((k) => k < before && R[k].s === sess && hasR(R[k])).sort();
  return ks.length ? [ks[ks.length - 1], R[ks[ks.length - 1]]] : null;
}
function paceOf(e) { const sec = parseTime(e.time), km = kgNum(e.km); return sec && km ? sec / km : null; }
function runCard(sess, wk) {
  const P = RUN[sess], w = P.weeks[((wk % P.weeks.length) + P.weeks.length) % P.weeks.length];
  const key = dateEl.value, cur = R[key] && R[key].s === sess ? R[key] : {};
  const other = R[key] && hasR(R[key]) && R[key].s !== sess;
  const prev = runPrev(sess, key);
  const el = document.createElement("section");
  el.className = "card";
  el.innerHTML = `
    <div class="card-top">
      <div class="card-name">${esc(P.name)}<div class="sub">${esc(P.when)}</div></div>
      <span class="scheme run">Seduta ${Object.keys(RUN).indexOf(sess) + 1}</span>
    </div>
    <div class="workout"><b>${esc(w.t)}</b><div>${esc(w.d)}</div><div class="sub">${esc(P.warm)}</div></div>
    ${vids([...(w.v || []), ...P.v])}
    ${other ? `<div class="sub warn">Il ${fmtDate(key)} hai già segnato l'altra seduta: salvando qui la sostituisci.</div>` : ""}
    <div class="log log3">
      <label>Km totali<input id="km-${sess}" inputmode="decimal" autocomplete="off" placeholder="es. 5" value="${esc(cur.km || "")}"></label>
      <label>Tempo totale<input id="time-${sess}" inputmode="numeric" autocomplete="off" placeholder="es. 27:30" value="${esc(cur.time || "")}"></label>
      <label>Fatica 1–10<input id="rpe-${sess}" inputmode="numeric" autocomplete="off" placeholder="es. 7" value="${esc(cur.rpe || "")}"></label>
      ${P.split ? `<label class="wide">${esc(P.split)}<input id="split-${sess}" inputmode="numeric" autocomplete="off" placeholder="es. 4:45" value="${esc(cur.split || "")}"></label>` : ""}
    </div>
    <div class="prev" id="pace-${sess}">${cur.km && cur.time ? "Ritmo medio: <b>" + fmtPace(paceOf(cur)) + " /km</b>" : ""}</div>
    <div class="prev">${prev ? `Ultima volta (${fmtDate(prev[0])}): <b>${esc(prev[1].km || "–")} km</b> in <b>${esc(prev[1].time || "–")}</b>${paceOf(prev[1]) ? " · " + fmtPace(paceOf(prev[1])) + " /km" : ""}${prev[1].split ? " · parte veloce " + esc(prev[1].split) + " /km" : ""}` : "Nessuna seduta precedente"}</div>`;
  for (const f of ["km", "time", "rpe", "split"]) {
    const inp = el.querySelector(`#${f}-${sess}`);
    if (!inp) continue;
    inp.addEventListener("input", () => {
      const base = R[key] && R[key].s === sess ? R[key] : { s: sess };
      R[key] = { ...base, s: sess, [f]: inp.value.trim(), t: Date.now() };
      const p = paceOf(R[key]);
      el.querySelector(`#pace-${sess}`).innerHTML = p ? "Ritmo medio: <b>" + fmtPace(p) + " /km</b>" : "";
      queueSave();
    });
  }
  return el;
}
function renderRun() {
  const list = $("list");
  const wk = runWeekIndex(dateEl.value) + runWeekOffset;
  const n = ((wk % RUN_LEN) + RUN_LEN) % RUN_LEN;
  list.innerHTML = `
    <section class="panel">
      <div class="panel-head">
        <button class="btn ghost small" id="wkPrev" aria-label="Settimana precedente">◀</button>
        <div class="center"><h2>Settimana ${n + 1} di ${RUN_LEN}</h2><div class="sub">${runWeekOffset ? (runWeekOffset > 0 ? "+" : "") + runWeekOffset + " rispetto a questa" : "questa settimana"} ${RUN_INFO.label ? " · " + esc(RUN_INFO.label) : ""}</div></div>
        <button class="btn ghost small" id="wkNext" aria-label="Settimana successiva">▶</button>
      </div>
      <div class="sub">Segni la corsa sul giorno scelto in alto (${fmtDate(dateEl.value)}). ${esc(RUN_INFO.note || "")}</div>
    </section>`;
  for (const sess of Object.keys(RUN)) list.appendChild(runCard(sess, wk));
  list.insertAdjacentHTML("beforeend", `<section class="panel"><div class="sub">Il blocco è iniziato la settimana del ${fmtDate(runStart)}. <button class="linkbtn" id="wkReset">Fai ripartire da questa settimana</button></div></section>`);
  $("wkPrev").onclick = () => { runWeekOffset--; renderRun(); };
  $("wkNext").onclick = () => { runWeekOffset++; renderRun(); };
  $("wkReset").onclick = () => { runStart = weekStart(todayKey()); runWeekOffset = 0; try { localStorage.setItem(K.runStart, runStart); } catch (e) {} renderRun(); setStatus("Blocco di corsa ripartito dalla settimana 1."); };
}

// ---------- Cibo ----------
const open = {};
function renderFood() {
  const list = $("list");
  list.innerHTML = "";
  list.appendChild(subnav([["pasti", "Pasti"], ["peso", "Peso"], ["spesa", "Spesa"], ["info", "Info"]], foodSub, (k) => { foodSub = k; }));
  ({ pasti: renderMeals, peso: renderWeight, spesa: renderShop, info: renderTips })[foodSub](list);
}
function renderMeals(list) {
  const key = dateEl.value, d = dietDay(key), plan = FOOD[d.type];
  const types = document.createElement("section");
  types.className = "panel";
  types.innerHTML = `<div class="types">${Object.entries(FOOD).map(([k, p]) => `<button data-type="${k}" aria-pressed="${k === d.type}">${esc(p.name)}<small>${esc(p.sub)}</small></button>`).join("")}</div>
    <div class="sub">${d.auto ? `Automatico: ${esc(d.why)}. Tocca un altro tipo per cambiarlo.` : `Scelto da te. <button class="linkbtn" id="typeAuto">Torna automatico</button>`}</div>`;
  types.querySelectorAll("[data-type]").forEach((b) => b.onclick = () => { touchDiet(key, { type: b.dataset.type }); renderFood(); });
  list.appendChild(types);
  if (!d.auto) $("typeAuto").onclick = () => { const c = { ...D[key] }; delete c.type; D[key] = { ...c, t: Date.now() }; queueSave(); renderFood(); };

  const w = d.water || 0;
  list.insertAdjacentHTML("beforeend", `
    <section class="panel">
      <div class="water">
        <div><h2>Acqua</h2><div class="sub">Obiettivo 2–2,5 L · un bicchiere = 250 ml</div></div>
        <div class="water-n">${(w * 0.25).toFixed(2).replace(".", ",")} L</div>
      </div>
      <div class="glasses">${Array.from({ length: Math.max(10, w + 1) }, (_, i) => `<button class="glass${i < w ? " on" : ""}" data-i="${i}" aria-label="Bicchiere ${i + 1}"></button>`).join("")}</div>
    </section>`);

// ---------- Charts ----------
function niceStep(raw) {
  if (raw <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function fmtNum(v) { return v >= 10000 ? (v / 1000).toFixed(v >= 100000 ? 0 : 1).replace(".", ",") + "k" : String(Math.round(v * 10) / 10).replace(".", ","); }
// series: [{cls, label}] ; data: [{label, values:[..]}] stacked bars
function barChart(data, series, opts = {}) {
  const W = 600, H = 230, L = 58, R = 8, T = 22, B = 28;
  const totals = data.map((d) => d.values.reduce((a, b) => a + b, 0));
  const max = opts.max || Math.max(1, ...totals);
  const step = opts.step || niceStep(max / 3);
  const top = opts.max || Math.ceil(max / step) * step;
  const f = opts.fmt || fmtNum;
  const y = (v) => T + (H - T - B) * (1 - Math.min(v, top) / top);
  const bw = (W - L - R) / data.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = 0; v <= top + 1e-9; v += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 5}" text-anchor="end">${f(v)}</text>`;
  const every = Math.ceil(data.length / 7);
  data.forEach((d, i) => {
    const x = L + i * bw + bw * 0.16, w = bw * 0.68;
    let acc = 0;
    d.values.forEach((v, j) => { if (v > 0) { s += `<rect class="${series[j].cls}" x="${x}" y="${y(acc + v)}" width="${w}" height="${y(acc) - y(acc + v)}" rx="2"/>`; acc += v; } });
    if (i % every === 0 || i === data.length - 1) s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${d.label}</text>`;
  });
  const lt = totals[totals.length - 1];
  if (lt > 0) s += `<text class="val" x="${L + (data.length - 1) * bw + bw / 2}" y="${y(lt) - 6}" text-anchor="middle">${f(lt)}</text>`;
  s += "</svg>";
  if (series.length > 1) s += `<div class="legend">${series.map((sr) => `<span><i class="${sr.cls}"></i>${esc(sr.label)}</span>`).join("")}</div>`;
  return s;
}
function lineChart(pts, unit, cls, fmtV) {
  const W = 600, H = 230, L = 58, R = 18, T = 26, B = 28;
  const f = fmtV || ((v) => String(Math.round(v * 10) / 10).replace(".", ","));
  let lo = Math.min(...pts.map((p) => p.value)), hi = Math.max(...pts.map((p) => p.value));
  if (lo === hi) { lo -= 1; hi += 1; }
  const step = niceStep((hi - lo) / 3);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const x = (i) => pts.length === 1 ? (L + W - R) / 2 : L + (W - L - R) * i / (pts.length - 1);
  const y = (v) => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="chart ${cls}" viewBox="0 0 ${W} ${H}" role="img">`;
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 5}" text-anchor="end">${f(v)}</text>`;
  const line = pts.map((p, i) => `${x(i)},${y(p.value)}`).join(" ");
  if (pts.length > 1) s += `<polygon class="area" points="${x(0)},${y(lo)} ${line} ${x(pts.length - 1)},${y(lo)}"/><polyline class="line" points="${line}"/>`;
  const every = Math.ceil(pts.length / 6);
  pts.forEach((p, i) => {
    const last = i === pts.length - 1;
    s += `<circle class="dot" cx="${x(i)}" cy="${y(p.value)}" r="${last ? 5 : 3}"/>`;
    if (i % every === 0 || last) s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${p.label}</text>`;
  });
  const lp = pts[pts.length - 1];
  s += `<text class="val" x="${x(pts.length - 1)}" y="${y(lp.value) - 10}" text-anchor="${pts.length > 1 ? "end" : "middle"}">${f(lp.value)} ${unit}</text>`;
  return s + "</svg>";
}

function muscData(GG, days) {

function radarChart(done, plan) {

  const hi = Math.max(1, ...MGROUPS.map(([g]) => Math.max(done[g], plan ? plan[g] : 0)));
  const step = niceStep(hi / 4), top = Math.ceil(hi / step) * step;

  for (let v = step; v <= top + 1e-9; v += step) {
    s += `<polygon class="ring" points="${poly(MGROUPS.map(() => v))}"/>`;
    const [tx, ty] = pt(0, v);

  }
  MGROUPS.forEach((_, i) => { const [x, y] = pt(i, top); s += `<line class="spoke" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
  if (plan) s += `<polygon class="plan" points="${poly(MGROUPS.map(([g]) => plan[g]))}"/>`;
  s += `<polygon class="done" points="${poly(MGROUPS.map(([g]) => done[g]))}"/>`;
  MGROUPS.forEach(([g], i) => { if (done[g] > 0) { const [x, y] = pt(i, done[g]); s += `<circle class="pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`; } });
  MGROUPS.forEach(([g, name], i) => {
    const c = Math.cos(ang(i)), sn = Math.sin(ang(i));
    const x = cx + c * (R + 18), y = cy + sn * (R + 18);
    const anchor = Math.abs(c) < 0.25 ? "middle" : c > 0 ? "start" : "end";
    const dy = sn < -0.5 ? -14 : sn > 0.5 ? 12 : -2;
    const low = plan && plan[g] > 0 && done[g] < plan[g] * 0.5;
    s += `<text class="lbl" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}">${name}</text>`;
    s += `<text class="num${low ? " low" : ""}" x="${x.toFixed(1)}" y="${(y + dy + 18).toFixed(1)}" text-anchor="${anchor}">${plan ? fmtNum(done[g]) + " / " + fmtNum(plan[g]) : fmtNum(done[g]) + " serie"}</text>`;
  });

}

  const bestK = paced.reduce((a, k) => !a || paceOf(RR[k]) < paceOf(RR[a]) ? k : a, null);
  const r30 = runKeys.filter((k) => k >= from30);
  const sec30 = r30.reduce((a, k) => a + (parseTime(RR[k].time) || 0), 0), km30 = r30.filter((k) => parseTime(RR[k].time)).reduce((a, k) => a + km(k), 0);
  const rpes = r30.map((k) => kgNum(RR[k].rpe)).filter((v) => v != null);
  const types = {};
  for (const k of r30) { const s = RR[k].s; const n = RUN && RUN[s] ? RUN[s].name : "Libera"; types[n] = types[n] || { n: 0, km: 0 }; types[n].n++; types[n].km += km(k); }

      <div class="facts f4">
        ${fact("Km questo mese", fmt1(kmMonth))}${fact("Km totali", fmt1(kmTot))}
        ${fact("Più lunga", longK ? fmt1(km(longK)) + " km" : "–")}${fact("Ritmo migliore", bestK ? fmtPace(paceOf(RR[bestK])) + " /km" : "–")}
        ${fact("Ritmo medio 30 gg", km30 ? fmtPace(sec30 / km30) + " /km" : "–")}${fact("Corse 30 gg", String(r30.length))}
        ${fact("Fatica media 30 gg", rpes.length ? fmt1(rpes.reduce((a, b) => a + b, 0) / rpes.length) + "/10" : "–")}${fact("Corse totali", String(runKeys.length))}
      </div>
      ${tl.length ? `<div class="sub">Km per tipo di seduta, ultimi 30 giorni</div><div class="hbars">${tl.map(([n, v]) => `<div class="hbar"><span class="name">${esc(n)}</span><span class="track"><span class="fill run" style="width:${Math.round(100 * v.km / tMax)}%"></span></span><span>${fmt1(v.km)} km · ${v.n}×</span></div>`).join("")}</div>` : ""}
      ${longK || bestK ? `<p class="sub">${longK ? "Corsa più lunga il " + fmtDate(longK) + ". " : ""}${bestK ? "Ritmo migliore il " + fmtDate(bestK) + " su " + fmt1(km(bestK)) + " km." : ""}</p>` : ""}</section>`;
}

const sheetEl = $("sheet");

function openSheet(kind, title, draw) {

function hideSheet() { sheetEl.hidden = true; document.body.classList.remove("noscroll"); }
function closeSheet(then) {
  if (sheetEl.hidden) { if (then) then(); return; }
  hideSheet();

  else if (then) then();
}
window.addEventListener("popstate", () => {

// Apre un giorno nella sezione giusta (dalla scheda dettagli o dal calendario)
function gotoDay(k, t, sub) {

  const logged = Object.entries(G).filter(([id, h]) => GYM_EX[id] && hasG(h[k])).map(([id]) => GYM_EX[id].dayKey);
  gymDay = logged[0] || GYM_WD[weekday(k)] || gymDay;
