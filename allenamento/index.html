// Cosa è stato fatto in un giorno
function gymOn(k, GG) {
  const out = [];
  for (const id of Object.keys(GYM_EX)) {
    const e = (GG[id] || {})[k];
    if (!hasG(e)) continue;
    const reps = parseReps(e.r).reduce((a, b) => a + b, 0), kg = kgNum(e.kg);
    out.push({ id, ex: GYM_EX[id].ex, dayKey: GYM_EX[id].dayKey, e, vol: kg ? reps * kg : 0 });
  }
  return out;
}
const sumVol = (list) => list.reduce((a, x) => a + x.vol, 0);

// Torta (ciambella): segs = [{ label, value, color }]
function donut(segs, center, sub, title) {
  const tot = segs.reduce((a, s) => a + s.value, 0);
  const live = segs.filter((s) => s.value > 0);
  const gap = live.length > 1 ? 1.5 : 0;
  let off = 0, arcs = "";
  for (const s of live) {
    const p = 100 * s.value / tot, len = Math.max(0.1, p - gap);
    arcs += `<circle r="78" cx="100" cy="100" pathLength="100" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${-off}" style="stroke:${s.color}"/>`;
    off += p;
  }
  return `<div class="donutbox">
    <svg class="donut" viewBox="0 0 200 200" role="img" aria-label="${esc(title + ": " + segs.map((s) => s.label + " " + s.value).join(", "))}">
      <circle class="track" r="78" cx="100" cy="100"/><g transform="rotate(-90 100 100)">${arcs}</g>
      <text class="dc" x="100" y="104">${esc(center)}</text><text class="ds" x="100" y="132">${esc(sub)}</text></svg>
    <ul class="dleg">${segs.map((s) => `<li><i style="background:${s.color}"></i><span>${esc(s.label)}</span><b>${esc(s.show ?? s.value)}</b></li>`).join("")}</ul>
  </div>`;
}
// Anelli degli obiettivi: items = [{ label, done, goal, color, show }]
function rings(items) {
  const R0 = [80, 58, 36];
  const pctAll = Math.round(100 * items.reduce((a, it) => a + Math.min(1, it.goal ? it.done / it.goal : 0), 0) / items.length);
  const svg = items.map((it, i) => {
    const p = it.goal ? Math.min(100, 100 * it.done / it.goal) : 0;
    return `<circle class="rtrack" r="${R0[i]}" cx="100" cy="100" style="stroke:${it.color}"/>${p > 0 ? `<circle class="rfill" r="${R0[i]}" cx="100" cy="100" pathLength="100" stroke-dasharray="${p} 100" style="stroke:${it.color}"/>` : ""}`;
  }).join("");
  return { pct: pctAll, html: `<div class="donutbox">
    <svg class="donut rings" viewBox="0 0 200 200" role="img" aria-label="Obiettivi della settimana: ${pctAll}%"><g transform="rotate(-90 100 100)">${svg}</g><text class="dc small" x="100" y="109">${pctAll}%</text></svg>
    <ul class="dleg">${items.map((it) => `<li><i style="background:${it.color}"></i><span>${esc(it.label)}</span><b>${esc(it.show)}</b></li>`).join("")}</ul>
  </div>` };
}
// giorni in programma già passati (oggi conta solo se l'allenamento è già segnato)
function countPlanned(days, test, doneOn) { const t = todayKey(); return days.filter((k) => (k < t || (k === t && doneOn(k))) && test(weekday(k))).length; }
// Una torta per scheda, con la frase che dice com'è andata
function breakdown(kind, days, GG, RR, DD) {
  const shade = (p) => `color-mix(in srgb, var(--k) ${p}%, var(--card))`;
  const box = (title, msg, html) => `<section class="panel"><h2>${title}</h2><p class="msg">${msg}</p>${html}</section>`;
  if (kind === "gym" || kind === "run") {
    const doneOn = kind === "gym" ? (k) => gymOn(k, GG).length > 0 : (k) => hasR(RR[k]);
    const done = days.filter(doneOn).length;
    const planned = kind === "gym" ? countPlanned(days, (wd) => !!GYM_WD[wd], doneOn) : countPlanned(days, (wd) => RUN && Object.values(RUN).some((x) => (x.wd || []).includes(wd)), doneOn);
    if (!done && !planned) return "";
    const miss = Math.max(0, planned - done), pct = planned ? Math.min(100, Math.round(100 * done / planned)) : 100;
    const gym = kind === "gym", what = gym ? "allenamenti" : "corse", prev = gym ? "previsti" : "previste";
    const msg = !planned ? `${done} ${what} fuori programma.` : pct >= 100 ? `${gym ? "Tutti gli allenamenti previsti fatti" : "Tutte le corse previste fatte"}${done > planned ? ", più " + (done - planned) + " extra" : ""}. Ottimo.` : pct >= 75 ? `${done} ${what} su ${planned} ${prev}. Ci sei quasi.` : `${done} ${what} su ${planned} ${prev}: ${miss} ${gym ? "saltati" : "saltate"}.`;
    return box("Costanza", msg, donut([{ label: "Fatti", value: done, color: "var(--k)" }, { label: "Saltati", value: miss, color: "var(--line)" }], pct + "%", "costanza", "Costanza"));
  }
  if (kind === "meals") {
    let ok = 0, all = 0;
    for (const k of days) { const d = DD[k]; if (!d) continue; const ms = FOOD[dietDay(k, DD, GG, RR).type].meals; all += ms.length; ok += ms.filter((m) => (d.meals || {})[m.id]?.done).length; }
    if (!all) return "";
    const pct = Math.round(100 * ok / all);
    const msg = pct >= 90 ? "Dieta rispettata quasi sempre." : pct >= 70 ? `Hai seguito ${pct} pasti su 100: buona base, si può fare meglio.` : `Solo ${pct} pasti su 100 seguiti: qui c'è margine.`;
    return box("Pasti seguiti", msg, donut([{ label: "Fatti", value: ok, color: "var(--k)" }, { label: "Non segnati", value: all - ok, color: "var(--line)" }], pct + "%", "dei pasti", "Pasti seguiti"));
  }
  if (kind === "water") {
    const ls = days.filter((k) => DD[k]).map((k) => (DD[k].water || 0) * 0.25);
    if (!ls.length) return "";
    const hi = ls.filter((v) => v >= 2).length, mid = ls.filter((v) => v >= 1 && v < 2).length, lo = ls.length - hi - mid;
    const pct = Math.round(100 * hi / ls.length);
    const msg = pct >= 80 ? "Bevi abbastanza quasi ogni giorno." : `Obiettivo dei 2 L raggiunto in ${hi} giorni su ${ls.length}.`;
    return box("Obiettivo 2 L", msg, donut([{ label: "2 L o più", value: hi, color: "var(--k)" }, { label: "1–2 L", value: mid, color: shade(45) }, { label: "Meno di 1 L", value: lo, color: "var(--line)" }], pct + "%", "giorni ok", "Giorni con 2 L"));
  }
  return "";
}
const fmtKg = (v) => Math.round(v).toLocaleString("it-IT");

// ---------- Dettagli dal resoconto ----------
const KINDS = {
  gym: { title: "Palestra", cls: "c-gym", tab: "palestra", metrics: [["vol", "Volume (kg)"], ["ex", "Esercizi"]] },
  run: { title: "Corsa", cls: "c-run", tab: "corsa", metrics: [["km", "Km"], ["pace", "Ritmo"]] },
  weight: { title: "Peso", cls: "c-food", tab: "cibo", sub: "peso", metrics: [["kg", "Peso"]] },
  meals: { title: "Pasti", cls: "c-food", tab: "cibo", sub: "pasti", metrics: [["pct", "Pasti"]] },
  water: { title: "Acqua", cls: "c-water", tab: "cibo", sub: "pasti", metrics: [["l", "Acqua"]] },
};
const RANGES = [[14, "2 settimane"], [30, "1 mese"], [90, "3 mesi"]];
let det = { kind: "gym", metric: "vol", range: 30, sel: null };

function openDetail(kind) {
  det = { kind, metric: KINDS[kind].metrics[0][0], range: 30, sel: null };
  openSheet(kind, KINDS[kind].title, drawDetail);
}
function metricInfo(kind, metric, GG, RR, DD) {
  // returns { type: bar|line, val(k), fmt, unit, max?, step? }
  const gm = {};
  if (kind === "gym") for (const [id, h] of Object.entries(GG)) if (GYM_EX[id]) for (const k of Object.keys(h)) if (hasG(h[k])) gm[k] = true;
  const cache = {};
  const gl = (k) => cache[k] || (cache[k] = gm[k] ? gymOn(k, GG) : []);
  return {
    "gym:vol": { type: "bar", val: (k) => Math.round(sumVol(gl(k))), unit: "kg", sel: fmtKg },
    "gym:ex": { type: "bar", val: (k) => gl(k).length, unit: "", fmt: (v) => String(Math.round(v)) },
    "run:km": { type: "bar", val: (k) => hasR(RR[k]) ? kgNum(RR[k].km) || 0 : 0, unit: "km" },
    "run:pace": { type: "line", val: (k) => hasR(RR[k]) ? paceOf(RR[k]) : null, unit: "/km", fmt: fmtPace },
    "weight:kg": { type: "line", val: (k) => DD[k] && DD[k].kg ? DD[k].kg : null, unit: "kg", fmt: (v) => String(Math.round(v * 100) / 100).replace(".", ","), sel: fmt1 },
    "meals:pct": { type: "bar", val: (k) => mealPct(k, DD, GG, RR) || 0, unit: "%", max: 100, step: 50, fmt: (v) => Math.round(v) + "%" },
    "water:l": { type: "bar", val: (k) => DD[k] ? (DD[k].water || 0) * 0.25 : 0, unit: "L", max: 3, step: 1, fmt: (v) => fmt1(v).replace(",0", "") + " L" },
  }[kind + ":" + metric];
}

// Istogramma (o linea) giorno per giorno; ogni giorno si può toccare
function dayChart(days, vals, o) {
  const W = 600, H = 230, L = 58, Rr = 10, T = 30, B = 28;
  const n = days.length, bw = (W - L - Rr) / n;
  const f = o.fmt || fmtNum;
  const present = vals.filter((v) => v != null && (o.type === "line" || v > 0));
  let lo = 0, hi;
  if (o.type === "line") {
    lo = present.length ? Math.min(...present) : 0; hi = present.length ? Math.max(...present) : 1;
    if (lo === hi) { lo -= 1; hi += 1; }
  } else hi = o.max || Math.max(1, ...present);
  const step = o.step || niceStep((hi - lo) / 3);
  if (o.type === "line") lo = Math.floor(lo / step) * step;
  hi = o.max || Math.ceil(hi / step) * step;
  const y = (v) => T + (H - T - B) * (1 - (Math.min(v, hi) - lo) / (hi - lo));
  const cx = (i) => L + i * bw + bw / 2;
  const si = days.indexOf(o.sel);
  let s = `<svg class="chart daychart ${o.cls}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafico giorno per giorno">`;
  for (let v = lo; v <= hi + 1e-9; v += step) s += `<line class="grid" x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 5}" text-anchor="end">${f(v)}</text>`;
  if (si >= 0) s += `<rect class="selcol" x="${L + si * bw}" y="24" width="${bw}" height="${H - B - 24}" rx="3"/>`;
  if (o.type === "bar") {
    vals.forEach((v, i) => { if (v > 0) s += `<rect class="bar${i === si ? " on" : ""}" x="${L + i * bw + bw * 0.14}" y="${y(v)}" width="${bw * 0.72}" height="${Math.max(1, y(lo) - y(v))}" rx="${Math.min(3, bw * 0.2)}"/>`; });
  } else {
    const pts = vals.map((v, i) => v != null ? `${cx(i)},${y(v)}` : null).filter(Boolean);
    if (pts.length > 1) s += `<polyline class="line" points="${pts.join(" ")}"/>`;
    vals.forEach((v, i) => { if (v != null) s += `<circle class="dot${i === si ? " on" : ""}" cx="${cx(i)}" cy="${y(v)}" r="${i === si ? 7 : n > 40 ? 3 : 4}"/>`; });
  }
  const every = Math.ceil(n / 7);
  days.forEach((k, i) => { if ((n - 1 - i) % every === 0) s += `<text x="${cx(i)}" y="${H - 8}" text-anchor="middle">${fmtDate(k)}</text>`; });
  if (si >= 0 && vals[si] != null && (o.type === "line" || vals[si] > 0)) {
    const tx = Math.max(L + 45, Math.min(W - Rr - 45, cx(si))), fs = o.selFmt || f;
    s += `<text class="selv" x="${tx}" y="18" text-anchor="middle">${fs(vals[si])}${o.unit && !/%|L$/.test(fs(vals[si])) ? " " + o.unit : ""}</text>`;
  }
  days.forEach((k, i) => { s += `<rect class="hit" data-k="${k}" x="${L + i * bw}" y="0" width="${bw}" height="${H}"><title>${fmtDate(k)}</title></rect>`; });
  return s + "</svg>";
}

function fact(k, v) { return `<div class="fact"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`; }
function rangeFacts(kind, days, GG, RR, DD) {
  if (kind === "gym") {
    const per = days.map((k) => gymOn(k, GG)).filter((l) => l.length);
    const vols = per.map(sumVol);
    return fact("Allenamenti", per.length) + fact("Volume totale", fmtKg(vols.reduce((a, b) => a + b, 0)) + " kg") + fact("Seduta migliore", vols.length ? fmtKg(Math.max(...vols)) + " kg" : "–");
  }
  if (kind === "run") {
    const rs = days.filter((k) => hasR(RR[k])).map((k) => RR[k]);
    const km = rs.reduce((a, e) => a + (kgNum(e.km) || 0), 0);
    const both = rs.filter((e) => paceOf(e));
    const pace = both.length ? both.reduce((a, e) => a + parseTime(e.time), 0) / both.reduce((a, e) => a + kgNum(e.km), 0) : null;
    return fact("Corse", rs.length) + fact("Km totali", fmtNum(km)) + fact("Ritmo medio", pace ? fmtPace(pace) + " /km" : "–");
  }
  if (kind === "weight") {
    const ws = days.filter((k) => DD[k] && DD[k].kg).map((k) => DD[k].kg);
    return fact("Ultimo", ws.length ? fmt1(ws[ws.length - 1]) + " kg" : "–") + fact("Nel periodo", ws.length > 1 ? diffKg(ws[ws.length - 1], ws[0]) + " kg" : "–") + fact("Minimo", ws.length ? fmt1(Math.min(...ws)) + " kg" : "–");
  }
  if (kind === "meals") {
    const ps = days.map((k) => mealPct(k, DD, GG, RR)).filter((v) => v != null);
    return fact("Media", ps.length ? Math.round(ps.reduce((a, b) => a + b, 0) / ps.length) + "%" : "–") + fact("Giorni al 100%", ps.filter((v) => v === 100).length) + fact("Giorni segnati", ps.length);
  }
  const ls = days.filter((k) => DD[k] && DD[k].water).map((k) => DD[k].water * 0.25);
  return fact("Media", ls.length ? fmt1(ls.reduce((a, b) => a + b, 0) / ls.length) + " L" : "–") + fact("Giorni ≥ 2 L", ls.filter((v) => v >= 2).length) + fact("Massimo", ls.length ? fmt1(Math.max(...ls)) + " L" : "–");
}

function dayDetail(kind, k, GG, RR, DD) {
  if (kind === "gym") {
    const list = gymOn(k, GG);
    if (!list.length) return `<p class="empty">Nessun esercizio segnato in questo giorno.${GYM_WD[weekday(k)] ? " Era in programma " + esc(GYM[GYM_WD[weekday(k)]].full || GYM[GYM_WD[weekday(k)]].name) + "." : ""}</p>`;
    const plans = [...new Set(list.map((x) => x.dayKey))].map((d) => GYM[d].full || GYM[d].name).join(" + ");
    return `<div class="facts">${fact("Scheda", esc(plans))}${fact("Esercizi", list.length)}${fact("Volume", fmtKg(sumVol(list)) + " kg")}</div>
      <div class="tbl"><table><thead><tr><th>Esercizio</th><th class="num">Reps</th><th class="num">Kg</th><th class="num">Volume</th></tr></thead>
      <tbody>${list.map((x) => `<tr><td>${esc(x.ex.n)}</td><td class="num">${esc(x.e.r || "–")}</td><td class="num">${esc(x.e.kg || "–")}</td><td class="num muted">${x.vol ? fmtKg(x.vol) : "–"}</td></tr>`).join("")}</tbody></table></div>`;
  }
  if (kind === "run") {
    const e = RR[k];
    if (!hasR(e)) {
      const planned = RUN && Object.values(RUN).find((x) => (x.wd || []).includes(weekday(k)));
      return `<p class="empty">Nessuna corsa segnata in questo giorno.${planned ? " Era in programma " + esc(planned.name) + "." : ""}</p>`;
    }
    const P = RUN && RUN[e.s];
    return `<div class="facts">${fact("Seduta", esc(P ? P.name : e.s))}${fact("Km", esc(e.km || "–"))}${fact("Tempo", esc(e.time || "–"))}${fact("Ritmo medio", paceOf(e) ? fmtPace(paceOf(e)) + " /km" : "–")}${e.split ? fact("Parte veloce", esc(e.split) + " /km") : ""}${e.rpe ? fact("Fatica", esc(e.rpe) + "/10") : ""}</div>`;
  }
  if (kind === "weight") {
    const v = DD[k] && DD[k].kg;
    if (!v) return '<p class="empty">Nessuna pesata in questo giorno.</p>';
    const prev = weights(DD).filter((w) => w.k < k).pop();
    return `<div class="facts">${fact("Peso", fmt1(v) + " kg")}${fact("Rispetto a prima", prev ? diffKg(v, prev.v) + " kg" : "–")}${prev ? fact("Pesata precedente", fmtDate(prev.k)) : ""}</div>`;
  }
  const d = DD[k];
  if (!d) return '<p class="empty">Niente segnato in questo giorno.</p>';
  const dd = dietDay(k, DD, GG, RR), plan = FOOD[dd.type];
  if (kind === "water") return `<div class="facts">${fact("Acqua", fmt1((d.water || 0) * 0.25) + " L")}${fact("Bicchieri", d.water || 0)}${fact("Obiettivo", (d.water || 0) >= 8 ? "raggiunto ✓" : "2–2,5 L")}</div>`;
  return `<div class="facts">${fact("Giornata", esc(plan.name))}${fact("Pasti fatti", (mealPct(k, DD, GG, RR) ?? 0) + "%")}</div>
    <div>${plan.meals.map((m) => { const st = (d.meals || {})[m.id] || {}; return `<div class="mealrow"><span>${esc(m.n)} <span class="sub">${esc(m.h || "")}</span></span>${st.done ? '<span class="ok">✓ fatto</span>' : '<span class="no">non segnato</span>'}</div>`; }).join("")}</div>`;
}

function drawDetail() {
  const GG = SG(), RR = SR(), DD = SD(), K0 = KINDS[det.kind], today = todayKey();
  const days = Array.from({ length: det.range }, (_, i) => addDays(today, i - det.range + 1));
  const mi = metricInfo(det.kind, det.metric, GG, RR, DD);
  const vals = days.map(mi.val);
  const has = (v) => v != null && (mi.type === "line" || v > 0);
  if (!det.sel || !days.includes(det.sel)) { const li = vals.map(has).lastIndexOf(true); det.sel = li >= 0 ? days[li] : today; }
  const si = days.indexOf(det.sel);
  const anyData = vals.some(has);
  $("sheetBody").innerHTML = `
    ${demo ? '<div class="sub">Simulazione: dati inventati, non salvati.</div>' : ""}
    <div class="pills" role="group" aria-label="Periodo">${RANGES.map(([r, l]) => `<button data-range="${r}" aria-pressed="${r === det.range}">${l}</button>`).join("")}</div>
    <div class="facts">${rangeFacts(det.kind, days, GG, RR, DD)}</div>
    <section class="panel">
      <div class="panel-head"><h2>${esc(K0.metrics.find((m) => m[0] === det.metric)[1])}</h2>
        ${K0.metrics.length > 1 ? `<div class="pills" role="group" aria-label="Cosa mostrare">${K0.metrics.map(([m, l]) => `<button data-metric="${m}" aria-pressed="${m === det.metric}">${esc(l.replace(/ \(.*\)/, ""))}</button>`).join("")}</div>` : ""}</div>
      <div class="sub">${det.metric === "pace" ? "Più in basso = più veloce. " : ""}Tocca un giorno nel grafico per vedere cosa hai fatto.</div>
      ${anyData ? dayChart(days, vals, { type: mi.type, cls: K0.cls, sel: det.sel, fmt: mi.fmt, selFmt: mi.sel, unit: mi.unit, max: mi.max, step: mi.step }) : `<p class="empty">Nessun dato in questo periodo.${det.range < 90 ? " Prova un periodo più lungo." : ""}</p>`}
    </section>
    ${breakdown(det.kind, days, GG, RR, DD)}
    <section class="panel" id="dayPanel">
      <div class="dayhead">
        <button class="btn ghost small" data-step="-1" aria-label="Giorno precedente"${si <= 0 ? " disabled" : ""}>◀</button>
        <h3>${esc(longDate(det.sel))}</h3>
        <button class="btn ghost small" data-step="1" aria-label="Giorno successivo"${si >= days.length - 1 ? " disabled" : ""}>▶</button>
      </div>
      ${dayDetail(det.kind, det.sel, GG, RR, DD)}
      ${demo ? "" : `<div class="btns"><button class="btn" id="detGo">Apri questo giorno in ${esc(TABS[K0.tab] || "")}</button></div>`}
    </section>`;
  const body = $("sheetBody");
  body.querySelectorAll("[data-range]").forEach((b) => b.onclick = () => { det.range = +b.dataset.range; drawDetail(); });
  body.querySelectorAll("[data-metric]").forEach((b) => b.onclick = () => { det.metric = b.dataset.metric; drawDetail(); });
  body.querySelectorAll("[data-step]").forEach((b) => b.onclick = () => { det.sel = days[Math.max(0, Math.min(days.length - 1, si + +b.dataset.step))]; drawDetail(); });
  const svg = body.querySelector(".daychart");
  if (svg) svg.onclick = (ev) => {
    const r = ev.target.closest("[data-k]");
    if (!r) return;
    det.sel = r.dataset.k; drawDetail();
    $("dayPanel").scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
  if ($("detGo")) $("detGo").onclick = () => { const k = det.sel; closeSheet(() => gotoDay(k, K0.tab, K0.sub)); };
}

// ---------- Calendario per scegliere il giorno ----------
let cal = { month: null, sel: null };
function openCalendar() {
  cal = { month: dateEl.value.slice(0, 7), sel: dateEl.value };
  openSheet("cal", "Scegli il giorno", drawCalendar);
}
function plannedOn(k) {
  const wd = weekday(k), out = [];
  if (GYM_WD[wd]) out.push("palestra (" + (GYM[GYM_WD[wd]].full || GYM[GYM_WD[wd]].name) + ")");
  const p = RUN && Object.values(RUN).find((x) => (x.wd || []).includes(wd));
  if (p) out.push("corsa (" + p.name + ")");
  return out;
}
function drawCalendar() {
  const today = todayKey(), [y, m] = cal.month.split("-").map(Number);
  const first = cal.month + "-01";
  const nDays = new Date(y, m, 0).getDate();
  const start = weekStart(first);
  const cells = Math.ceil(((weekday(first) + 6) % 7 + nDays) / 7) * 7;
  const gd = gymDates(G);
  const rd = new Set(Object.keys(R).filter((k) => hasR(R[k])));
  let grid = ["L", "M", "M", "G", "V", "S", "D"].map((d) => `<div class="cal-w" aria-hidden="true">${d}</div>`).join("");
  for (let i = 0; i < cells; i++) {
    const k = addDays(start, i), out = k.slice(0, 7) !== cal.month;
    const g = gd.has(k), r = rd.has(k);
    const what = [g && "palestra", r && "corsa"].filter(Boolean).join(" e ");
    grid += `<button class="cal-d${out ? " out" : ""}${k === today ? " today" : ""}${k === cal.sel ? " sel" : ""}" data-k="${k}" aria-pressed="${k === cal.sel}" aria-label="${esc(longDate(k) + (what ? ", fatto " + what : ""))}">
      <span class="n">${+k.slice(8)}</span><span class="dots">${g ? '<i class="d-gym"></i>' : ""}${r ? '<i class="d-run"></i>' : ""}</span></button>`;
  }
  // riepilogo del giorno toccato
  const k = cal.sel, list = gymOn(k, G), e = R[k], d = D[k];
  const rows = [];
  if (list.length) rows.push(`<div class="row"><i class="d-gym"></i><span><b>Palestra</b> · ${esc([...new Set(list.map((x) => GYM[x.dayKey].full || GYM[x.dayKey].name))].join(" + "))} · ${list.length} esercizi${sumVol(list) ? " · volume " + fmtKg(sumVol(list)) + " kg" : ""}</span></div>`);
  if (hasR(e)) rows.push(`<div class="row"><i class="d-run"></i><span><b>Corsa</b> · ${esc(RUN && RUN[e.s] ? RUN[e.s].name : "")} · ${esc(e.km || "–")} km${e.time ? " in " + esc(e.time) : ""}${paceOf(e) ? " · " + fmtPace(paceOf(e)) + " /km" : ""}</span></div>`);
  if (d && d.kg) rows.push(`<div class="row"><span class="sub">Peso ${fmt1(d.kg)} kg</span></div>`);
  if (d && (mealPct(k) || d.water)) rows.push(`<div class="row"><span class="sub">Pasti ${mealPct(k) ?? 0}% · acqua ${fmt1((d.water || 0) * 0.25)} L</span></div>`);
  if (!list.length && !hasR(e)) { const p = plannedOn(k); rows.unshift(`<div class="row"><span class="sub">Nessun allenamento segnato.${p.length ? " In programma: " + esc(p.join(" e ")) + "." : ""}</span></div>`); }
  const mName = MONTHS[m - 1];
  $("sheetBody").innerHTML = `
    <div class="cal-nav">
      <button class="btn ghost small" data-mon="-1" aria-label="Mese precedente">◀</button>
      <h3>${mName} ${y}</h3>
      <button class="btn ghost small" data-mon="1" aria-label="Mese successivo">▶</button>
    </div>
    <div class="cal">${grid}</div>
    <div class="cal-legend"><span><i class="d-gym"></i>Palestra</span><span><i class="d-run"></i>Corsa</span></div>
    <section class="panel">
      <h2>${esc(longDate(k))}</h2>
      <div class="daysum">${rows.join("")}</div>
      <div class="btns">
        <button class="btn" id="calGo">Apri questo giorno</button>
        ${list.length && TABS.palestra ? '<button class="btn ghost" id="calGym">Vedi palestra</button>' : ""}
        ${hasR(e) && TABS.corsa ? '<button class="btn ghost" id="calRun">Vedi corsa</button>' : ""}
        ${k !== today ? '<button class="btn ghost" id="calToday">Oggi</button>' : ""}
      </div>
    </section>`;
  const body = $("sheetBody");
  body.querySelectorAll("[data-mon]").forEach((b) => b.onclick = () => {
    const dt = new Date(y, m - 1 + +b.dataset.mon, 1);
    cal.month = dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0");
    drawCalendar();
  });
  body.querySelector(".cal").onclick = (ev) => {
    const b = ev.target.closest("[data-k]");
    if (!b) return;
    cal.sel = b.dataset.k;
    if (cal.sel.slice(0, 7) !== cal.month) cal.month = cal.sel.slice(0, 7);
    drawCalendar();
  };
  $("calGo").onclick = () => closeSheet(() => setDate(k));
  if ($("calGym")) $("calGym").onclick = () => closeSheet(() => gotoDay(k, "palestra"));
  if ($("calRun")) $("calRun").onclick = () => closeSheet(() => gotoDay(k, "corsa"));
  if ($("calToday")) $("calToday").onclick = () => closeSheet(() => setDate(today));
}

// ---------- Sincronizzazione con il file sul NAS ----------
// Un solo file con tutto. Ogni voce ha t (ora della modifica): quando si unisce vince la più recente.
const FILE = (CONFIG.id || "allenamento") + "-dati.json";
function mergeGym(inc) {
  let n = 0;
  for (const [id, h] of Object.entries(inc || {})) {
    if (!GYM_EX[id] || !h || typeof h !== "object") continue;
    G[id] = G[id] || {};
    for (const [k, e] of Object.entries(h)) {
      if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
      if (!G[id][k] || (e.t || 0) > (G[id][k].t || 0)) { G[id][k] = { r: String(e.r || ""), kg: String(e.kg || ""), t: Number(e.t) || 0 }; n++; }
    }
  }
  return n;
}
function mergeRun(inc) {
  let n = 0;
  for (const [k, e] of Object.entries(inc || {})) {
    if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(k) || !(RUN && RUN[e.s])) continue;
    if (!R[k] || (e.t || 0) > (R[k].t || 0)) { R[k] = { s: e.s, km: String(e.km || ""), time: String(e.time || ""), split: String(e.split || ""), rpe: String(e.rpe || ""), t: Number(e.t) || 0 }; n++; }
  }
  return n;
}
function mergeDiet(inc) {
  let n = 0;
  for (const [k, d] of Object.entries(inc || {})) {
    if (!d || typeof d !== "object" || !/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    if (!D[k] || (d.t || 0) > (D[k].t || 0)) {
      const c = { meals: d.meals || {}, water: Number(d.water) || 0, t: Number(d.t) || 0 };
      if (FOOD[d.type]) c.type = d.type;
      if (d.kg) c.kg = Number(d.kg);
      D[k] = c; n++;
    }
  }
  return n;
}
// accepts the new file and the two old ones (palestra-dati.json, dieta-dati.json)
function mergeFile(text) {
  const f = JSON.parse(text);
  if (f && f.app === "allenamento" && (f.client || "") === (CONFIG.id || "")) return mergeGym(f.gym) + mergeRun(f.run) + mergeDiet(f.diet);
  if (f && f.app === "scheda-palestra" && !CONFIG.id) return mergeGym(f.logs);
  if (f && f.app === "piano-alimentare" && !CONFIG.id) return mergeDiet(f.days);
  throw new Error("bad_file");
}
function fileJson() { return JSON.stringify({ app: "allenamento", client: CONFIG.id || "", v: 1, savedAt: new Date().toISOString(), gym: G, run: R, diet: D }); }

function syncMeta() { try { return JSON.parse(localStorage.getItem(K.meta) || "{}"); } catch (e) { return {}; } }
function markSynced() { try { localStorage.setItem(K.meta, JSON.stringify({ last: Date.now() })); } catch (e) {} refreshSyncInfo(); }
function unsynced() {
  const last = syncMeta().last || 0;
  let n = 0;
  for (const h of Object.values(G)) for (const e of Object.values(h)) if ((e.t || 0) > last) n++;
  for (const e of Object.values(R)) if ((e.t || 0) > last) n++;
  for (const e of Object.values(D)) if ((e.t || 0) > last) n++;
  return n;
}
function fmtStamp(ms) { const d = new Date(ms); return fmtDate(todayKey(d)) + " alle " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
const canPickFile = typeof window.showSaveFilePicker === "function";
function idb(op, val) {
  return new Promise((res, rej) => {
    const r = indexedDB.open("allenamento", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const st = r.result.transaction("kv", op === "get" ? "readonly" : "readwrite").objectStore("kv"); const q = op === "get" ? st.get("file") : st.put(val, "file"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); };
  });
}
async function syncFile(choose) {
  let h = choose ? null : await idb("get").catch(() => null);
  if (!h) { h = await window.showSaveFilePicker({ suggestedName: FILE, types: [{ description: "Dati allenamento", accept: { "application/json": [".json"] } }] }); await idb("put", h).catch(() => {}); }
  // Il telefono a volte non risponde più sul file scelto giorni fa: dopo 30 secondi ci si ferma e si fa scegliere di nuovo.
  let timer;
  const stuck = new Promise((_, rej) => { timer = setTimeout(() => rej(new Error("timeout")), 30000); });
  try { return await Promise.race([useFile(h), stuck]); } finally { clearTimeout(timer); }
}
async function useFile(h) {
  if ((await h.queryPermission({ mode: "readwrite" })) !== "granted" && (await h.requestPermission({ mode: "readwrite" })) !== "granted") throw new Error("no_permission");
  const text = await (await h.getFile()).text();
  const n = text.trim() ? mergeFile(text) : 0;
  persist();
  const w = await h.createWritable(); await w.write(fileJson()); await w.close();
  return n;
}
function syncMsg(t, err) { $("syncMsg").textContent = t; $("syncMsg").classList.toggle("err", !!err); }
function refreshSyncInfo() {
  const last = syncMeta().last, n = unsynced();
  $("syncInfo").textContent = (last ? "Ultima sincronizzazione: " + fmtStamp(last) + ". " : "Mai sincronizzato. ") + (n ? n + (n === 1 ? " modifica da sincronizzare." : " modifiche da sincronizzare.") : "Tutto sincronizzato.");
  $("syncBtn").classList.toggle("dirty", n > 0);
}
function renderSync() {
  $("syncBody").innerHTML = `
    ${canPickFile ? `<p class="sub">Legge il file dei dati, unisce con quelli di questo dispositivo e lo aggiorna. Un solo file per palestra, corsa e alimentazione.</p>
    <div class="btns"><button class="btn" id="syncGo">Sincronizza ora</button><button class="btn ghost" id="syncPick">Scegli un altro file</button></div>
    <p class="sub">La prima volta scegli dove tenere <b>${FILE}</b>: ${esc(APP.syncHint || "una cartella sul PC (o su un disco di rete); sul telefono la cartella Download.")} Se il file esiste già conferma "Sostituisci": prima viene letto e unito.</p>` : `<p class="sub">Questo browser non può aprire file direttamente: usa Chrome.</p>`}
    <div class="btns"><button class="btn ghost small" id="importOld">Importa un file vecchio</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
    <p class="sub">Per unire i dati dei file delle app precedenti (palestra-dati.json o dieta-dati.json), per esempio quelli del PC.</p>`;
  if (canPickFile) {
    const run = async (choose) => {
      syncMsg("Sincronizzazione…");
      try { const n = await syncFile(choose); markSynced(); render(); syncMsg("Fatto ✓ " + (n ? n + " dati nuovi presi dal file." : "Il file è aggiornato.")); }
      catch (e) {
        if (e && e.message === "timeout") { await idb("put", null).catch(() => {}); return syncMsg("Il file non risponde. Tocca \"Scegli un altro file\" e scegli di nuovo " + FILE + " (in Download sul telefono). I dati restano salvati qui.", true); }
        if (e && e.name === "AbortError") return syncMsg("Annullato.");
        if (e && (e.name === "NotFoundError" || e.name === "NotAllowedError" || e.message === "no_permission")) { await idb("put", null).catch(() => {}); return syncMsg("Il file non si trova più o non ho il permesso. Tocca \"Scegli un altro file\" e sceglilo di nuovo.", true); }
        if (e && e.message === "bad_file") return syncMsg("Quel file non è " + FILE + ". Scegli quello giusto con \"Scegli un altro file\".", true);
        syncMsg("Non riesco a raggiungere il file. Sei a casa e il NAS è collegato? Riprova o sceglilo di nuovo.", true);
      }
    };
    $("syncGo").onclick = () => run(false);
    $("syncPick").onclick = () => run(true);
  }
  $("importOld").onclick = () => $("importFile").click();
  $("importFile").onchange = async (ev) => {
    const f = ev.target.files[0]; ev.target.value = "";
    if (!f) return;
    try { const n = mergeFile(await f.text()); persist(); render(); refreshSyncInfo(); syncMsg("Importato ✓ " + n + " dati nuovi."); }
    catch (e) { syncMsg("Questo file non contiene dati delle app (palestra, dieta o allenamento).", true); }
  };
}
$("syncBtn").onclick = () => { const p = $("syncPanel"); p.hidden = !p.hidden; if (!p.hidden) { renderSync(); syncMsg(""); refreshSyncInfo(); } };
$("syncClose").onclick = () => { $("syncPanel").hidden = true; };

// ---------- Data, nuovo giorno, installazione ----------
function setDate(k) {
  dateEl.value = k || todayKey();
  if (GYM_WD[weekday(dateEl.value)]) gymDay = GYM_WD[weekday(dateEl.value)];
  runWeekOffset = 0;
  render();
}
$("dateBtn").onclick = () => openCalendar();
let shownToday = todayKey();
function checkNewDay() {
  const now = todayKey();
  if (now === shownToday) return;
  const wasToday = dateEl.value === shownToday;
  shownToday = now;
  if (!wasToday) return;
  dateEl.value = now;
  tab = defaults(now); runWeekOffset = 0; demo = null;
  renderTabs(); render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkNewDay(); });
window.addEventListener("focus", checkNewDay);
setInterval(checkNewDay, 60000);

let installEvt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; $("installBtn").hidden = false; });
$("installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("installBtn").hidden = true; };
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

renderTabs();
render();
refreshSyncInfo();
setStatus("Pronto. I dati si salvano sul dispositivo.");

</script>
